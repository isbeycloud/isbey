name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Build, Lint, Typecheck & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Lint Code (Oxlint)
        run: npm run lint

      - name: Build Production Assets
        run: npm run build

      - name: Security Audit (npm audit)
        run: npm run security-audit

      - name: Local regression suites (isolated databases)
        run: npm test
