    <style>
      /* Critical above-the-fold styles for LCP optimization */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        background: #090d16;

        overflow-x: hidden;
      }
      #root { min-height: 100vh; }

      /* Prevent FOUC (Flash of Unstyled Content) */
      #root:empty::before {
        content: '';
        display: block;
        position: fixed;
        inset: 0;
        background: #090d16;
        z-index: 9999;
      }

      /* Global smooth transitions & keyframes */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        50% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.8); }
      }
      @keyframes ticker-scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      .animate-fade-in { animation: fadeInUp 0.6s ease both; }
      .spin { animation: spin 1s linear infinite; }
      .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

      /* Range input custom styling */
      input[type="range"] {
        -webkit-appearance: none;
        height: 6px;
        border-radius: 3px;
        background: #1e293b;
        outline: none;

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
